services:
  # 1. Backend Web Service (Node.js)
  - type: web
    name: finovert-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # You must set this in the Render dashboard (e.g., MongoDB Atlas connection string)
      - key: CLIENT_ORIGIN
        sync: false # Set this to your Vercel frontend URL (e.g., https://finovert.vercel.app)
      - key: PORT
        value: 10000
